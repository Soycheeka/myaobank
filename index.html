if(!/^\d{4}$/.test(v('rp')))return $('#er').textContent='Пароль — рівно 4 цифри';
const u={id:'u'+Date.now(),surname:v('rs'),name:v('rn'),email:v('re'),nick:v('rk'),pin:v('rp'),avatar:'',cards:[newCard(v('ry'))]};
DB.users.push(u);me=u;ci=0;sv();home()}
function login(){app.innerHTML=`<div class="auth"><h2>Вхід</h2><select id="lu">${DB.users.map(u=>`<option value="${u.id}">${uname(u)}</option>`).join('')}</select>
<input id="lp" type="password" inputmode="numeric" maxlength="4" placeholder="Пароль (4 цифри)"><div class="err" id="er"></div>
<button class="btn" onclick="doLogin()">Увійти</button><div class="lnk" onclick="reg()">Нова реєстрація</div></div>`}
function doLogin(){const u=DB.users.find(x=>x.id===$('#lu').value);if(u&&u.pin===$('#lp').value){me=u;ci=0;st=0;sv();home()}else $('#er').textContent='Невірний пароль'}

function cardHTML(c){const logo=c.sys==='Visa'?'<span class="vs">VISA</span>':'<span class="mc"><i></i><i></i></span>';
return `<div class="card s${st}" id="cd" onclick="flip()"><div class="face"><div class="row"><b style="font-size:18px">Мяобанк</b>${logo}</div><div class="chip"></div>

<div style="font-size:12px;margin-top:6px">Дитяча картка</div></div>
<div class="face bk"><div class="stripe"></div><div class="cvv">${c.cvv}</div></div></div>`}
function flip(){st=(st+1)%3;$('#cd').className='card s'+st;$('#bl').style.opacity=st?0:1}
function home(){const c=card();
app.innerHTML=`<div class="top"><button class="ib" onclick="drawer(1)">☰</button><b>Мяобанк</b></div>
<div class="stage"><div class="bal" id="bl" style="opacity:${st?0:1}">${FX(fmt(c.bal))}</div>
<div class="wrap">${cardHTML(c)}</div>
${me.cards.length>1?`<div class="dots">${me.cards.map((x,i)=>`<span class="${i===ci?'on':''}" onclick="ci=${i};st=0;home()">•••• ${x.num.slice(-4)}</span>`).join('')}</div>`:''}</div>
<div class="menus" style="margin-top:14px"><button onclick="tr()">Переказати на картку</button><button onclick="uah()">Перерахувати в гривні</button></div>
<div class="ops"><h4>Останні операції</h4>${c.ops.length?c.ops.slice(0,3).map(opH).join(''):'<div style="color:var(--mut);font-size:14px">Операцій поки немає</div>'}
${c.ops.length?'<div class="lnk" onclick="allOps()">Усі операції</div>':''}</div>
<div class="ov" id="ov" onclick="closeS()"></div><div class="ov" id="dov" onclick="drawer(0)"></div>
<div class="drawer" id="dr"><div style="text-align:center">${me.avatar?`<img class="av" src="${me.avatar}">`:'<div class="av"></div>'}<b>${uname(me)}</b><div style="font-size:12px;color:var(--mut)">${me.nick?'@'+me.nick:''}</div></div>
<div class="it" onclick="profile()" style="margin-top:14px">Профіль</div><div class="it" onclick="acts()">Дії з карткою</div><div class="it" onclick="me=null;sv();st=0;DB.users.length?login():reg()">Вийти</div>
<div class="adm" onclick="admin()">адміністратор</div></div>`}
function drawer(o){$('#dr').classList.toggle('on',!!o);$('#dov').classList.toggle('on',!!o);$('#dov').style.zIndex=5}
const opH=o=>`<div class="op"><div>${o.s?'Таємниця':o.t}<small>${o.d}</small></div><div class="${o.a>0?'pl':'mn'}">${o.a>0?'+':'−'}${fmt(Math.abs(o.a))}</div></div>`;
function allOps(){sheet(`<h3>Усі операції</h3>${card().ops.map(opH).join('')}`)}
function addOp(c,t,a){c.ops.unshift({t,a,d:now()})}

let pick=null;
function tr(){pick=null;sheet(`<h3>Переказати на картку</h3><input id="q" placeholder="Введіть ім'я або номер картки" oninput="srch()"><div id="rs"></div>
<input id="am" type="number" min="0" step="0.01" placeholder="Сума у Фіксах"><div class="err" id="er"></div><button class="btn" onclick="send()">Переказати</button>`)}
function srch(){const q=$('#q').value.trim().toLowerCase(),d=q.replace(/\s/g,'');pick=null;if(!q)return $('#rs').innerHTML='';
const m=[];DB.users.forEach(u=>u.cards.forEach(c=>{if(c===card())return;
if(uname(u).toLowerCase().includes(q)||u.surname.toLowerCase().includes(q)||(u.nick&&u.nick.toLowerCase().includes(q))||(/^\d+$/.test(d)&&c.num.includes(d)))m.push([u,c])}));
window._m=m;$('#rs').innerHTML=m.slice(0,6).map((x,i)=>`<div class="res" id="r${i}" onclick="sel(${i})">${uname(x[0])} ${x[0].nick?'(@'+x[0].nick+')':''}<br><small>•••• ${x[1].num.slice(-4)} · ${x[1].sys}</small></div>`).join('')||'<div class="err">Нікого не знайдено</div>'}
function sel(i){pick=_m[i][1];document.querySelectorAll('.res').forEach(e=>e.classList.remove('on'));$('#r'+i).classList.add('on')}
function send(){const c=card(),a=Math.round(parseFloat($('#am').value)*100);
if(!pick)return $('#er').textContent='Оберіть отримувача';
if(!(a>0))return $('#er').textContent='Вкажіть суму';
if(a>c.bal)return $('#er').textContent='Недостатньо Фіксів';
const ru=DB.users.find(u=>u.cards.includes(pick));
c.bal-=a;pick.bal+=a;addOp(c,'Переказ → '+uname(ru),-a);addOp(pick,'Переказ від '+uname(me),a);sv();closeS();home()}
function uah(){const c=card();sheet(`<h3>Перерахувати в гривні</h3><p>Поточний баланс:</p><p style="font-size:26px;font-weight:700">${FX(fmt(c.bal))}</p>
<p style="color:var(--mut)">Курс: 10 Фіксів = 1 грн</p><p style="font-size:22px;margin-top:8px">≈ ${(c.bal/1000).toFixed(2)} грн</p>
<input id="am" type="number" min="0" step="0.01" placeholder="Скільки Фіксів перерахувати"><div class="err" id="er"></div><button class="btn" onclick="conv()">Перерахувати</button>`)}
function conv(){const c=card(),a=Math.round(parseFloat($('#am').value)*100);
if(!(a>0))return $('#er').textContent='Вкажіть суму';if(a>c.bal)return $('#er').textContent='Недостатньо Фіксів';
c.bal-=a;addOp(c,'Обмін на '+(a/1000).toFixed(2)+' грн',-a);sv();closeS();home()}

function profile(){drawer(0);sheet(`<h3>Профіль</h3><img class="av" id="pa" src="${me.avatar||''}"><input type="file" accept="image/*" onchange="ava(this)">
<input id="ps" value="${me.surname}" placeholder="Прізвище"><input id="pn" value="${me.name}" placeholder="Ім'я"><input id="pk" value="${me.nick}" placeholder="Нікнейм">
<div class="err" id="er"></div><button class="btn" onclick="saveP()">Зберегти</button>`)}
let newAv=null;
function ava(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=128,cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);newAv=cv.toDataURL('image/jpeg',.8);$('#pa').src=newAv};im.src=r.result};r.readAsDataURL(f)}
function saveP(){if(!$('#ps').value.trim()||!$('#pn').value.trim())return $('#er').textContent="Прізвище та ім'я обов'язкові";
me.surname=$('#ps').value.trim();me.name=$('#pn').value.trim();me.nick=$('#pk').value.trim();if(newAv)me.avatar=newAv;newAv=null;sv();closeS();home()}
function acts(){drawer(0);sheet(`<h3>Дії з карткою</h3><button class="btn s" onclick="chPin()">Зміна паролю</button><button class="btn s" onclick="chCvv()">Зміна CVV</button><button class="btn s" onclick="addC()">Додати ще одну картку</button>`)}
function chPin(){sheet(`<h3>Змінити пароль</h3><input id="o" type="password" inputmode="numeric" maxlength="4" placeholder="Старий пароль"><input id="n" type="password" inputmode="numeric" maxlength="4" placeholder="Новий пароль (4 цифри)"><div class="err" id="er"></div><button class="btn" onclick="doPin()">Змінити</button>`)}
function doPin(){if($('#o').value!==me.pin)return $('#er').textContent='Старий пароль невірний';if(!/^\d{4}$/.test($('#n').value))return $('#er').textContent='Потрібно 4 цифри';me.pin=$('#n').value;sv();closeS()}
function chCvv(){sheet(`<h3>Змінити CVV</h3><input id="o" type="password" inputmode="numeric" maxlength="4" placeholder="Пароль від акаунта"><input id="n" inputmode="numeric" maxlength="3" value="${rnd(3)}"><div class="err" id="er"></div><button class="btn" onclick="doCvv()">Змінити</button>`)}
function doCvv(){if($('#o').value!==me.pin)return $('#er').textContent='Невірний пароль';if(!/^\d{3}$/.test($('#n').value))return $('#er').textContent='CVV — 3 цифри';card().cvv=$('#n').value;sv();closeS();home()}
function addC(){sheet(`<h3>Нова картка</h3><select id="ry"><option>Visa</option><option>Mastercard</option></select><button class="btn" onclick="me.cards.push(newCard($('#ry').value));ci=me.cards.length-1;st=0;sv();closeS();home()">Створити</button>`)}
function admin(){drawer(0);sheet(`<h3>Адмін-доступ</h3><input id="w" placeholder="Слово-код"><div class="err" id="er"></div><button class="btn" onclick="chkA()">Увійти</button>`)}
function chkA(){if($('#w').value==='dimple')admPanel();else $('#er').textContent='Невірне слово-код'}
function admPanel(){sheet(`<h3>Адмінка</h3>${DB.users.map(u=>u.cards.map(c=>`<div class="res"><b>${uname(u)}</b> · ${spc(c.num)}<br><small>CVV ${c.cvv} · ${fmt(c.bal)} Ф</small></div>`).join('')).join('')||'Користувачів немає'}
<select id="ac">${DB.users.flatMap(u=>u.cards.map(c=>`<option value="${c.num}">${uname(u)} •••• ${c.num.slice(-4)}</option>`)).join('')}</select>
<input id="aa" type="number" step="0.01" placeholder="Нарахувати Фікси (можна мінус)"><button class="btn" onclick="admAdd()">Нарахувати</button>`)}
function admAdd(){const c=DB.users.flatMap(u=>u.cards).find(c=>c.num===$('#ac').value),a=Math.round(parseFloat($('#aa').value)*100);
if(!c||!a)return;c.bal=Math.max(0,c.bal+a);addOp(c,'Адміністратор',a);sv();admPanel();if(me)setTimeout(()=>{},0)}
function cardHTML(c){const logo=c.sys==='Visa'?'<span class="vs">VISA</span>':'<span class="mc"><i style="position:static"></i><i style="position:static"></i></span>';
return `<div class="card s${st}" id="cd" onclick="flip()"><div class="face"><i class="g1"></i><i class="g2"></i>
<div class="row"><b style="font-size:20px">Мяобанк</b><svg class="cl" viewBox="0 0 24 24" fill="none" stroke="#2b3300" stroke-width="2" stroke-linecap="round"><path d="M7 7a7 7 0 0 1 0 10M11 4a11 11 0 0 1 0 16M15 1a15 15 0 0 1 0 22" transform="translate(2 0)"/></svg></div>
<div class="chip"></div><div class="num">${spc(c.num)}</div>
<div class="row"><div><div class="dc">Дитяча картка</div><div style="font-size:11px;margin-top:3px">${uname(me).toUpperCase()}</div></div><div style="text-align:right"><div style="font-size:13px;margin-bottom:3px">01/27</div>${logo}</div></div></div>
<div class="face bk"><i class="g1"></i><div class="stripe"></div><div class="sig"><b>${c.cvv}</b></div><div style="position:absolute;bottom:14px;right:16px;font-weight:700">Мяобанк</div></div></div>`}
const avt=u=>u.avatar?`<img class="ca" src="${u.avatar}">`:`<div class="ca">${u.name[0]}</div>`;
function fvl(){me.fav=me.fav||[];return me.fav}
function tr(){pick=null;const o=$('#ov');o.innerHTML=`<div class="full" onclick="event.stopPropagation()"><div class="fh"><span class="bk2" onclick="closeS()">←</span><h3>Переказ на картку</h3><input id="q" placeholder="Уведіть ім'я або номер картки" oninput="tl()"></div><div class="fb" id="tb"></div></div>`;o.classList.add('on');tl()}
function rowH(u,c){return `<div class="cr" onclick="pk('${c.num}')">${avt(u)}<span>${uname(u)}${u.nick?' (@'+u.nick+')':''}<small>•••• ${c.num.slice(-4)} · ${c.sys}</small></span><b class="stt ${fvl().includes(c.num)?'on':''}" onclick="event.stopPropagation();fv('${c.num}')">★</b></div>`}
function tl(){const q=$('#q').value.trim().toLowerCase(),d=q.replace(/\s/g,''),m=[];
DB.users.forEach(u=>u.cards.forEach(c=>{if(c===card())return;if(!q||uname(u).toLowerCase().includes(q)||(u.nick||'').toLowerCase().includes(q)||(/^\d+$/.test(d)&&c.num.includes(d)))m.push([u,c])}));
const fv2=m.filter(x=>fvl().includes(x[1].num));
$('#tb').innerHTML=(!q&&fv2.length?`<div class="box"><h4>Обрані</h4><div class="favs">${fv2.map(x=>`<div onclick="pk('${x[1].num}')">${avt(x[0])}${x[0].name}</div>`).join('')}</div></div>`:'')+
`<div class="box"><h4>${q?'Результати':'Контакти'}</h4>${m.map(x=>rowH(x[0],x[1])).join('')||'<div style="color:var(--mut)">Нікого не знайдено</div>'}</div>`}
function fv(n){const f=fvl(),i=f.indexOf(n);i<0?f.push(n):f.splice(i,1);sv();tl()}
function pk(n){let u,c;DB.users.forEach(x=>x.cards.forEach(y=>{if(y.num===n){u=x;c=y}}));pick=c;
$('#tb').innerHTML=`<div class="box"><div class="cr">${avt(u)}<span>${uname(u)}<small>${spc(c.num)}</small></span></div>
<input id="am" type="number" min="0" step="0.01" placeholder="Сума у Фіксах"><div class="err" id="er"></div><button class="btn" onclick="send()">Переказати</button><button class="btn s" onclick="tl()">Обрати іншого</button></div>`}

const CATSVG='<svg viewBox="0 0 120 90"><polygon points="14,40 18,4 48,24" fill="#7b2fa0"/><polygon points="106,40 102,4 72,24" fill="#7b2fa0"/><polygon points="22,32 24,14 38,24" fill="#9a9aa5"/><polygon points="98,32 96,14 82,24" fill="#9a9aa5"/><ellipse cx="60" cy="52" rx="48" ry="36" fill="#7b2fa0"/><circle cx="42" cy="46" r="11" fill="#fff"/><circle cx="78" cy="46" r="11" fill="#fff"/><circle cx="45" cy="42" r="5" fill="#222"/><circle cx="81" cy="42" r="5" fill="#222"/><path d="M54 64q6 6 12 0" stroke="#fff" stroke-width="2" fill="none"/></svg>';
const allCards=()=>DB.users.flatMap(u=>u.cards);
const bk=()=>'<button class="btn s" onclick="acts()">Назад</button>';
const cs=c=>{const k=c.color||'#afcb1f';return `background:${c.grad||`linear-gradient(135deg,color-mix(in srgb,${k} 82%,#fff),${k} 50%,color-mix(in srgb,${k} 85%,#000))`};color:${c.tc||'#2b3300'}`};
function cardHTML(c){const logo=c.sys==='Visa'?'<span class="vs">VISA</span>':'<span class="mc"><i style="position:static"></i><i style="position:static"></i></span>';

return `<div class="card s${st}" id="cd" onclick="flip()"><div class="face" style="${cs(c)}"><i class="g1"></i><i class="g2"></i>
<div class="row"><b style="font-size:20px">Мяобанк</b><svg class="cl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7a7 7 0 0 1 0 10M11 4a11 11 0 0 1 0 16M15 1a15 15 0 0 1 0 22" transform="translate(2 0)"/></svg></div>
<div class="chip"></div><div class="num">${spc(c.num)}</div>
<div class="row"><div><div class="dc">${c.label||lbl(me)}</div><div style="font-size:11px;margin-top:3px">${uname(me).toUpperCase()}</div></div><div style="text-align:right"><div style="font-size:13px;margin-bottom:3px">01/27</div>${logo}</div></div>${bl}</div>
<div class="face bk" style="${cs(c)}"><i class="g1"></i><div class="stripe"></div><div class="sig"><b>${c.cvv}</b></div><div style="position:absolute;bottom:14px;right:16px;font-weight:700">Мяобанк</div>${bl}</div></div>`}
function home(){const c=card();
app.innerHTML=`<div class="top"><button class="ib" onclick="drawer(1)">☰</button><b>Мяобанк</b></div>
<div class="stage"><div class="bal" id="bl" style="opacity:${st?0:1}">${FX(fmt(c.bal))}</div>
<div class="wrap">${cardHTML(c)}</div>
${me.cards.length>1?`<div class="dots">${me.cards.map((x,i)=>`<span class="${i===ci?'on':''}" onclick="ci=${i};st=0;home()">•••• ${x.num.slice(-4)}</span>`).join('')}</div>`:''}</div>
<div class="menus" style="margin-top:14px"><button onclick="tr()">Переказати на картку</button><button onclick="uah()">Перерахувати в гривні</button></div>
<div class="ops"><h4>Останні операції</h4>${c.ops.length?c.ops.slice(0,3).map(opH).join(''):'<div style="color:var(--mut);font-size:14px">Операцій поки немає</div>'}
${c.ops.length?'<div class="lnk" onclick="allOps()">Усі операції</div>':''}</div>
<div class="ov" id="ov" onclick="closeS()"></div><div class="ov" id="dov" onclick="drawer(0)"></div>
<div class="drawer" id="dr"><div style="text-align:center">${me.avatar?`<img class="av" src="${me.avatar}">`:'<div class="av"></div>'}<b>${uname(me)}</b><div style="font-size:12px;color:var(--mut)">${ADM?'Адміністраторський мішок':(me.nick?'@'+me.nick:'')}</div></div>
${ADM?`<div class="it" style="margin-top:14px" onclick="acts()">Дії із власною карткою</div><div class="it" onclick="oth()">Дії із іншими картками</div><div class="it" onclick="cw()">Змінити код-слово</div><div class="it" onclick="exitA()">Вийти з мішка</div>`
:`<div class="it" style="margin-top:14px" onclick="profile()">Профіль</div><div class="it" onclick="acts()">Дії з карткою</div><div class="it" onclick="me=null;sv();st=0;DB.users.length?login():reg()">Вийти</div><div class="adm" onclick="admin()">адміністраторський мішок</div>`}</div>`}
function acts(){drawer(0);const c=card();sheet(`<h3>${ADM?'Дії із власною карткою':'Дії з карткою'}</h3>${ADM?'':'<button class="btn s" onclick="chPin()">Зміна паролю</button>'}<button class="btn s" onclick="chCvv()">Зміна CVV</button><button class="btn s" onclick="colr()">Змінити колір</button>${ADM?'':'<button class="btn s" onclick="addC()">Додати ще одну картку</button>'}<button class="btn s" onclick="tgB()">${c.blocked?'Розблокувати':'Заблокувати'} картку</button><button class="btn" onclick="closeS();drawer(1)">Назад</button>`)}
['chPin','chCvv','addC'].forEach(n=>{const f=window[n];window[n]=function(){f();$('.sheet').insertAdjacentHTML('beforeend',bk())}});
function tgB(){const c=card();c.blocked=!c.blocked;sv();closeS();home()}
const COLS=[['Червоний','#e0524a','#fff'],['Оранжевий','#f0932b','#2b1a00'],['Жовтий','#f2d02e','#2b2500'],['Зелений','#4caf50','#06260a'],['Блакитний','#5bc0eb','#06232e'],['Синій','#3f6fd8','#fff'],['Фіолетовий','#8e5fd0','#fff'],['Чорний','#222','#fff'],['Білий','#f5f5f5','#222'],['Бежевий','#e6d5b8','#3a2f1a'],['Рожевий','#f48fb1','#3a0f20'],['Базовий','#afcb1f','#2b3300']];

function send(){const c=card(),a=Math.round(parseFloat($('#am').value)*100),E=t=>$('#er').textContent=t;
if(c.blocked)return E('Вашу картку заблоковано');if(!pick)return E('Оберіть отримувача');if(pick.blocked)return E('Картку отримувача заблоковано');
if(!(a>0))return E('Вкажіть суму');if(a>c.bal)return E('Недостатньо Фіксів');
const ru=DB.users.find(u=>u.cards.includes(pick));c.bal-=a;pick.bal+=a;addOp(c,'Переказ → '+uname(ru),-a);addOp(pick,'Переказ від '+uname(me),a);sv();closeS();home()}

function docsOf(){const o={},add=u=>{const{cards,...r}=u,cs=cards||[];o['users/'+u.id]=JSON.stringify({...r,cn:cs.map(c=>c.num)});cs.forEach(c=>o['cards/'+c.num]=JSON.stringify({...c,own:u.id}))};

function build(m){const us={},cs={};for(const k in m){const[c,i]=k.split('/'),v=JSON.parse(m[k]);if(c==='users')us[i]=v;else if(c==='cards')cs[i]=v;else if(i==='adm')DB.word=v.word}
const arr=Object.values(us).map(u=>{const{cn,...r}=u;r.cards=(cn||[]).map(n=>{const c=cs[n];if(!c)return null;const{own,...cc}=c;return cc}).filter(Boolean);return r});
DB.users=arr.filter(u=>u.id!=='fix');DB.fix=arr.find(u=>u.id==='fix')||DB.fix}
function push(){if(!dbh||!ready)return;clearTimeout(pt);pt=setTimeout(async()=>{const o=docsOf();for(const k in o){if(last[k]===o[k])continue;last[k]=o[k];const[c,i]=k.split('/');try{await dbh.collection(c).doc(i).set({j:o[k]});rem[k]=o[k]}catch(e){delete last[k]}}pt=null},150)}
