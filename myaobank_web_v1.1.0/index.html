let LU=null,FU=null,FC=null,FN=null,FT=0;
function welcome(){app.innerHTML=`<div class="auth"><div class="hi" style="margin-top:12vh">Мяобанк</div><div class="sub">Банк для твоїх фіксів</div><div style="height:6vh"></div><button class="btn" onclick="reg()">Зареєструватись</button><button class="btn s" onclick="login()">Увійти</button></div>`}
const _reg=reg;reg=function(){_reg();$('.auth').insertAdjacentHTML('afterbegin','<div class="lnk" style="text-align:left;margin:0 0 6px" onclick="welcome()">← Назад</div>')};
const bkL='<div class="lnk" style="text-align:left;margin:0 0 6px" onclick="welcome()">← Назад</div>';
const chkH='<label class="chk"><input type="checkbox" onchange="if(this.checked)forgot()">Не пам\'ятаю пароль</label>';
function login(){const u=DB.users.find(x=>x.id===localStorage.getItem('fixlast'));if(!u)return loginList();LU=u.id;
app.innerHTML=`<div class="auth">${bkL}<h2 style="text-align:center">Вхід</h2><div class="cr" style="justify-content:center;cursor:default">${avt(u)}<b style="font-size:20px">${uname(u)}</b></div>
<input id="lp" type="password" inputmode="numeric" maxlength="4" placeholder="Пароль (4 цифри)">${chkH}<div class="err" id="er"></div><button class="btn" onclick="doLogin()">Увійти</button><div class="lnk" onclick="loginList()">Не ви? Обрати інший акаунт</div></div>`}
function loginList(){LU=null;app.innerHTML=`<div class="auth">${bkL}<h2 style="text-align:center">Вхід</h2><select id="lu">${DB.users.map(u=>`<option value="${u.id}">${uname(u)}</option>`).join('')}</select>
<input id="lp" type="password" inputmode="numeric" maxlength="4" placeholder="Пароль (4 цифри)">${chkH}<div class="err" id="er"></div><button class="btn" onclick="doLogin()">Увійти</button></div>`}
function doLogin(){const id=$('#lu')?$('#lu').value:LU,u=DB.users.find(x=>x.id===id);if(u&&u.pin===$('#lp').value){me=u;ci=0;st=0;sv();home()}else $('#er').textContent='Невірний пароль'}
function forgot(){const id=$('#lu')?$('#lu').value:LU,u=DB.users.find(x=>x.id===id);if(!u)return;FU=u;
const m=(u.phone||'').replace(/^(\+38)(\d)(\d{2})(\d{3})(\d{2})(\d{2})$/,'$1$2** *** **$6');
app.innerHTML=`<div class="auth"><div class="lnk" style="text-align:left;margin:0 0 6px" onclick="login()">← Назад</div><h2 style="text-align:center">Відновлення доступу</h2><p style="text-align:center;margin:8px 0">Підтвердіть номер телефону або вкажіть новий.</p>
${u.phone?`<button class="btn" onclick="sendCode(0)">Підтвердити ${m}</button>`:''}<div class="lb">Або вкажіть новий номер</div><div class="ph"><span>+38</span><input id="fn" inputmode="numeric" maxlength="10" placeholder="0XXXXXXXXX" oninput="this.value=this.value.replace(/\\D/g,'')"></div><div class="err" id="er"></div><button class="btn s" onclick="sendCode(1)">Надіслати код на новий номер</button></div>`}
function smsDemo(c,p){const o=$('#toast');if(o)o.remove();const e=document.createElement('div');e.id='toast';e.innerHTML='📩 SMS (демо) на '+p+'<br>Ваш код: <b style="font-size:22px">'+c+'</b>';app.appendChild(e);setTimeout(()=>e.remove(),25000)}
function sendCode(n){const E=t=>$('#er').textContent=t;FN=null;
if(n){const p=$('#fn').value.trim();if(!/^\d{10}$/.test(p))return E('Номер: 10 цифр після +38');const ph='+38'+p;if(DB.users.some(x=>x.phone===ph&&x.id!==FU.id))return E('Цей номер уже закріплений за іншим акаунтом.');FN=ph}
FC=String(Math.floor(100000+Math.random()*900000));FT=Date.now()+300000;const to=FN||FU.phone;
app.innerHTML=`<div class="auth"><div class="lnk" style="text-align:left;margin:0 0 6px" onclick="forgot()">← Назад</div><h2 style="text-align:center">Новий пароль</h2><p style="text-align:center;margin:8px 0">Код надіслано на ${to}</p>
<input id="np" type="password" inputmode="numeric" maxlength="4" placeholder="Новий пароль (4 цифри)"><input id="cd2" inputmode="numeric" maxlength="6" placeholder="Код з SMS (6 цифр)"><div class="err" id="er"></div><button class="btn" onclick="verify()">Підтвердити</button><div class="lnk" onclick="sendCode(${n})">Надіслати код ще раз</div></div>`;smsDemo(FC,to)}
function verify(){const E=t=>$('#er').textContent=t;if(Date.now()>FT)return E('Код прострочено. Надішліть новий.');
if(!/^\d{4}$/.test($('#np').value))return E('Пароль — рівно 4 цифри');if($('#cd2').value.trim()!==FC)return E('Невірний код');
FU.pin=$('#np').value;if(FN)FU.phone=FN;FC=null;me=FU;ci=0;st=0;sv();home()}
function cat(t,o={}){clearTimeout(ct);clearTimeout(rm);let e=$('#cat');if(!e){e=document.createElement('div');e.id='cat';app.appendChild(e)}
const pose=/Привіт/.test(t)?'hi':/дурити/.test(t)?'wow':/фікс|Фікс|кота у мішку/.test(t)?'think':'front';

function sunTimes(t){let ds;try{ds=new Date(t).toLocaleDateString('en-CA',{timeZone:'Europe/Kyiv'})}catch(e){ds=new Date(t+10800000).toISOString().slice(0,10)}
